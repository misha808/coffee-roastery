{% extends 'admin/_layout.html' %}
{% set active = 'products' %}
{% block title %}{{ 'Новий товар' if is_new else 'Редагування товару' }} — Адмін-панель{% endblock %}
{% block heading %}{{ 'Новий товар' if is_new else 'Редагування товару' }}{% endblock %}
{% block body %}
<form class="panel stack form-narrow" method="post">
    <div><label for="name">Назва</label><input id="name" name="name" value="{{ product.name }}" required autofocus></div>
    <div><label for="description">Опис смаку</label><textarea id="description" name="description">{{ product.description }}</textarea></div>
    <div class="two">
        <div><label for="price">Ціна за 250 г, грн</label><input id="price" name="price" type="number" step="0.01" min="0" value="{{ product.price }}" required></div>
        <div><label for="roast_id">Обсмаження</label>
            <select id="roast_id" name="roast_id" required>
                {% for r in roasts %}<option value="{{ r.id }}" {{ 'selected' if product.roast_id|string == r.id|string }}>{{ r.name }}</option>{% endfor %}
            </select></div>
    </div>
    <div class="inline"><button class="btn" type="submit">{{ 'Додати' if is_new else 'Зберегти' }}</button>
    <a class="btn ghost" href="{{ url_for('admin.products') }}">Скасувати</a></div>
</form>
{% endblock %}
